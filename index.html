<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高精度 金額計算＆値段比較（JS版）</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:sans-serif;background:#f4f7f9;color:#333;display:flex;justify-content:center;padding:20px}
  .container{background:#fff;width:100%;max-width:560px;padding:22px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.08)}
  h1{font-size:1.3rem;text-align:center;margin-bottom:4px}
  .sub{font-size:.8rem;text-align:center;color:#666;margin-bottom:16px}
  .tabs{display:flex;border-bottom:2px solid #e2e8f0;margin-bottom:16px}
  .tab-btn{flex:1;padding:10px;background:none;border:none;font-weight:bold;color:#718096;cursor:pointer}
  .tab-btn.active{color:#3182ce;border-bottom:3px solid #3182ce}
  .tab-content{display:none}.tab-content.active{display:block}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
  .box{background:#f8fafc;border:1px solid #cbd5e0;border-radius:8px;padding:12px}
  .box h3{font-size:.95rem;margin-bottom:8px;border-bottom:1px solid #e2e8f0;padding-bottom:4px}
  .fg{margin-bottom:10px;width:100%}
  .row{display:flex;gap:10px}
  label{display:block;font-size:.78rem;font-weight:bold;margin-bottom:3px;color:#4a5568}
  input,select{width:100%;padding:8px;font-size:.95rem;border:1px solid #cbd5e0;border-radius:6px}
  .btn{width:100%;padding:11px;font-size:1rem;font-weight:bold;color:#fff;background:#3182ce;border:none;border-radius:6px;cursor:pointer;margin-top:4px}
  .btn:hover{background:#2b6cb0}
  .card{margin-top:16px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:14px}
  .r-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #edf2f7;font-size:.9rem}
  .r-row:last-child{border:none}
  .r-row.tot{border-top:2px solid #cbd5e0;font-size:1.05rem;color:#2b6cb0;margin-top:4px;padding-top:8px}
  .win{background:#ebf8ff;border:1px solid #90cdf4;color:#2b6cb0;padding:10px;border-radius:6px;text-align:center;font-weight:bold;margin-bottom:10px;font-size:.95rem}
  .err{background:#fed7d7;color:#c53030;padding:8px;border-radius:6px;font-size:.85rem;margin-bottom:12px}
  .hidden{display:none}
</style>
</head>
<body>
<div class="container">
  <h1>高精度 金額計算＆値段比較</h1>
  <p class="sub">0.00 〜 100億円（0.01銭単位）まで誤差なしで計算</p>
  <div class="tabs">
    <button class="tab-btn active" id="tb-comp" onclick="toTab('comp')">値段比較（ペンなど）</button>
    <button class="tab-btn" id="tb-calc" onclick="toTab('calc')">通常の金額計算</button>
  </div>
  <div id="err" class="err hidden"></div>

  <!-- 値段比較タブ -->
  <div id="tc-comp" class="tab-content active">
    <div class="grid">
      <div class="box">
        <h3>商品 A（ペンA）</h3>
        <div class="fg"><label>単価（円）</label><input id="ap" value="120.00"></div>
        <div class="fg"><label>数量（本）</label><input id="aq" value="1"></div>
        <div class="fg"><label>割引率（%）</label><input id="ad" value="0"></div>
      </div>
      <div class="box">
        <h3>商品 B（ペンB）</h3>
        <div class="fg"><label>単価（円）</label><input id="bp" value="150.00"></div>
        <div class="fg"><label>数量（本）</label><input id="bq" value="1"></div>
        <div class="fg"><label>割引率（%）</label><input id="bd" value="0"></div>
      </div>
    </div>
    <div class="row">
      <div class="fg"><label>消費税率</label>
        <select id="ctax"><option value="10" selected>10%</option><option value="8">8%</option><option value="0">0%</option></select>
      </div>
      <div class="fg"><label>端数処理</label>
        <select id="crnd"><option value="DOWN" selected>切り捨て</option><option value="HALF_UP">四捨五入</option><option value="UP">切り上げ</option></select>
      </div>
    </div>
    <button class="btn" onclick="compItems()">値段を比較する</button>
    <div class="card">
      <div id="win" class="win">-</div>
      <div class="r-row"><span>商品A 合計（1本あたり）</span><strong id="ra">-</strong></div>
      <div class="r-row"><span>商品B 合計（1本あたり）</span><strong id="rb">-</strong></div>
      <div class="r-row tot"><span>合計金額の差額</span><strong id="rdiff">-</strong></div>
    </div>
  </div>

  <!-- 通常計算タブ -->
  <div id="tc-calc" class="tab-content">
    <div class="fg"><label>金額 1（円）</label><input id="m1" value="10000000000.00"></div>
    <div class="fg"><label>追加・減算する金額 2（円）</label><input id="m2" value="123.45"></div>
    <div class="row">
      <div class="fg"><label>割引率（%）</label><input id="disc" value="0"></div>
      <div class="fg"><label>消費税率</label>
        <select id="tax"><option value="10" selected>10%</option><option value="8">8%</option><option value="0">0%</option></select>
      </div>
      <div class="fg"><label>端数処理</label>
        <select id="rnd"><option value="DOWN" selected>切り捨て</option><option value="HALF_UP">四捨五入</option><option value="UP">切り上げ</option></select>
      </div>
    </div>
    <button class="btn" onclick="calcNormal()">計算する</button>
    <div class="card">
      <div class="r-row"><span>小計（金額1 + 金額2）</span><strong id="rsub">-</strong></div>
      <div class="r-row"><span>割引後金額</span><strong id="rdisc">-</strong></div>
      <div class="r-row"><span>消費税額</span><strong id="rtax">-</strong></div>
      <div class="r-row tot"><span>税込合計</span><strong id="rtot">-</strong></div>
    </div>
  </div>
</div>

<script>
// 小数文字列をBigIntの分子・分母に分解して誤差を完全に防ぐヘルパー
function parseDec(str) {
  const s = (str || "0").trim().replace(/,/g, "");
  if (!/^-?\d+(\.\d+)?$/.test(s)) throw new Error("数値の形式が不正です");
  const neg = s.startsWith("-");
  const [intPart, fracPart = ""] = s.replace("-", "").split(".");
  const scale = 10n ** BigInt(fracPart.length);
  const num = BigInt(intPart + fracPart) * (neg ? -1n : 1n);
  return { num, den: scale };
}

// BigIntの有理数除算を端数処理（DOWN / HALF_UP / UP）付きで整数化
function divRound(num, den, mode) {
  if (den === 0n) throw new Error("0で割ることはできません");
  const neg = (num < 0n) !== (den < 0n);
  const a = num < 0n ? -num : num;
  const b = den < 0n ? -den : den;
  let q = a / b;
  const r = a % b;
  if (r > 0n) {
    if (mode === "UP") q += 1n;
    else if (mode === "HALF_UP" && r * 2n >= b) q += 1n;
  }
  return neg ? -q : q;
}

class Money {
  constructor(cents) { this.cents = cents; }

  static fromYen(str) {
    const { num, den } = parseDec(str);
    return new Money(divRound(num * 100n, den, "HALF_UP"));
  }

  add(o) { return new Money(this.cents + o.cents); }

  mul(qtyStr, mode) {
    const { num, den } = parseDec(qtyStr || "1");
    return new Money(divRound(this.cents * num, den, mode));
  }

  divUnit(qtyStr) {
    const { num, den } = parseDec(qtyStr || "1");
    if (num <= 0n) throw new Error("数量は1以上を指定してください");
    return new Money(divRound(this.cents * den, num, "HALF_UP"));
  }

  discount(pctStr, mode) {
    const { num, den } = parseDec(pctStr || "0");
    // 1 - (pct / 100) = (100*den - num) / (100*den)
    return new Money(divRound(this.cents * (100n * den - num), 100n * den, mode));
  }

  tax(rateStr, mode) {
    const { num, den } = parseDec(rateStr || "0");
    return new Money(divRound(this.cents * num, 100n * den, mode));
  }

  toString() {
    const sg = this.cents < 0n ? "-" : "";
    const abs = this.cents < 0n ? -this.cents : this.cents;
    const y = (abs / 100n).toLocaleString("ja-JP");
    const s = String(abs % 100n).padStart(2, "0");
    return `${sg}${y}円${s}銭`;
  }
}

const el = id => document.getElementById(id);
function showErr(msg = "") {
  const e = el("err");
  e.textContent = msg;
  e.classList.toggle("hidden", !msg);
}

function toTab(name) {
  showErr();
  ["comp", "calc"].forEach(t => {
    el("tb-" + t).classList.toggle("active", t === name);
    el("tc-" + t).classList.toggle("active", t === name);
  });
}

function compItems() {
  showErr();
  try {
    const r = el("crnd").value, tr = el("ctax").value;
    const aq = el("aq").value, bq = el("bq").value;

    const asub = Money.fromYen(el("ap").value).mul(aq, r).discount(el("ad").value, r);
    const atot = asub.add(asub.tax(tr, r));
    const au = atot.divUnit(aq);

    const bsub = Money.fromYen(el("bp").value).mul(bq, r).discount(el("bd").value, r);
    const btot = bsub.add(bsub.tax(tr, r));
    const bu = btot.divUnit(bq);

    const du = new Money(au.cents > bu.cents ? au.cents - bu.cents : bu.cents - au.cents);
    let w = "1本あたりの実質単価は同じです";
    if (au.cents < bu.cents) w = `【商品A】が 1本あたり ${du} お得！`;
    else if (bu.cents < au.cents) w = `【商品B】が 1本あたり ${du} お得！`;

    el("win").textContent = w;
    el("ra").textContent = `${atot}（単価: ${au}）`;
    el("rb").textContent = `${btot}（単価: ${bu}）`;
    el("rdiff").textContent = String(new Money(atot.cents > btot.cents ? atot.cents - btot.cents : btot.cents - atot.cents));
  } catch (e) {
    showErr("入力エラー: " + e.message);
  }
}

function calcNormal() {
  showErr();
  try {
    const r = el("rnd").value, tr = el("tax").value;
    const sub = Money.fromYen(el("m1").value).add(Money.fromYen(el("m2").value));
    const dsc = sub.discount(el("disc").value, r);
    const tx = dsc.tax(tr, r);
    el("rsub").textContent = String(sub);
    el("rdisc").textContent = String(dsc);
    el("rtax").textContent = String(tx);
    el("rtot").textContent = String(dsc.add(tx));
  } catch (e) {
    showErr("入力エラー: " + e.message);
  }
}

compItems();
calcNormal();
</script>
</body>
</html>
